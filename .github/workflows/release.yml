name: Build Windows release
on:
  push:
    branches: [main]
    paths:
      - '*.cs'
      - build.ps1
      - test.ps1
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test image ordering and scrollbar preservation
        shell: pwsh
        run: ./test.ps1
      - name: Build application and package dependencies
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ImageZipMerger-v1.9
          path: build/ImageZipMerger-v1.9.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.9'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag build/ImageZipMerger-v1.9.zip --clobber
          } else {
            gh release create $tag build/ImageZipMerger-v1.9.zip --target "${{ github.sha }}" --title 'ImageZipMerger v1.9' --notes '이미지 드래그 및 다중 선택 순서 변경, ↑/↓ 버튼과 Alt+↑/↓ 단축키를 추가했습니다. 회차·이미지 목록의 순서 변경 시 가로 스크롤 위치를 유지합니다. Windows 64비트용입니다. ZIP을 모두 압축 해제한 뒤 ImageZipMerger.exe를 실행하세요.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

name: Build and test Windows application
on:
  push:
    branches: [main]
    paths:
      - '*.cs'
      - '*.ps1'
      - 'assets/**'
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        shell: pwsh
        run: ./test.ps1
      - name: Build application and package dependencies
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ImageZipMerger-dev
          path: build/ImageZipMerger-dev.zip
          retention-days: 7

name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.11'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        shell: pwsh
        run: |
          $output = New-Object System.Collections.ArrayList
          try {
            & ./test.ps1 2>&1 | ForEach-Object { $output.Add($_.ToString()) | Out-Null; Write-Output $_ }
          } catch {
            $output.Add("THROW: " + $_.Exception.Message) | Out-Null
          }
          $failed = @($output | Where-Object { $_ -match 'Test compilation failed|Reorder regression tests failed|THROW:' }).Count -gt 0
          if ($failed) {
            $detail = (($output | ForEach-Object { $_ } | Where-Object { $_ -match 'Exception:' } | Select-Object -Last 2) -join ' / ')
            if ([string]::IsNullOrEmpty($detail)) { $detail = 'regression tests failed' }
            Write-Output ("::error::" + $detail)
            exit 1
          }
      - name: Build application and package dependencies
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ImageZipMerger-v1.11
          path: build/ImageZipMerger-v1.11.zip
          retention-days: 7
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.11'
          $file = 'build/ImageZipMerger-v1.11.zip'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --target "${{ github.sha }}" --title 'ImageZipMerger v1.11' --notes '미리보기 1:1.41 표시와 창 맞춤 축소, 미리보기 안내 문구 정리, 창 크기 저장 및 복원, 기본 창 936x970, ZIP 저장 후 자동 정리 옵션을 추가했습니다. Windows 64비트용입니다. ZIP을 모두 압축 해제한 뒤 ImageZipMerger.exe를 실행하세요.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
